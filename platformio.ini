[platformio]
src_dir = esp32_cube_enc
; One build per physical cube; the per-cube values live in
; esp32_cube_enc/cube_config.h.  Always name the cube when flashing:
;     pio run -e cube1 -t upload
;     pio run -e cube2 -t upload
; Without -e only cube1 is built and flashed.
default_envs = cube1

[env]
; Pinned rather than the floating "stable" link: releases after 55.03.311
; require PlatformIO Core >= 6.2.0.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
; The default 460800 fails on Cube1's board (serial noise; its crystal
; measures 41 MHz), so upload at 115200.
upload_speed = 115200
lib_deps = fastled/FastLED
; Regenerate the gzipped dashboard from the HTML literal before every build,
; so dashboard_gz.h can never drift from the page source in web_interface.cpp.
extra_scripts = pre:tools/pio_gzip_dashboard.py

[env:cube1]
build_flags = -DCUBE=1

[env:cube2]
build_flags = -DCUBE=2
