[platformio]
src_dir = esp32_cube_enc

[env:esp32dev]
; Pinned rather than the floating "stable" link: releases after 55.03.311
; require PlatformIO Core >= 6.2.0.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps = fastled/FastLED
; Regenerate the gzipped dashboard from the HTML literal before every build,
; so dashboard_gz.h can never drift from the page source in web_interface.cpp.
extra_scripts = pre:tools/pio_gzip_dashboard.py
